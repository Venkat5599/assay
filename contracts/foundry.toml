[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
via_ir = false
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
shrink_run_limit = 5000

[profile.ci.fuzz]
runs = 5000
[profile.ci.invariant]
runs = 1024
depth = 128

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
botchain = "${BOTCHAIN_RPC_URL}"
botchain_testnet = "${BOTCHAIN_TESTNET_RPC_URL}"

# Verification is a command-line concern, not a config one. Foundry 1.5 rejects
# an [etherscan] entry for a chain it does not know, and it rejects it at
# startup - which took every `forge script` invocation down with
# "Chain 677 not supported", including simulation and deployment, whether or
# not verification was being asked for. BOT Chain runs Blockscout and verifies
# without credentials, so there was never a key to configure. Verify with:
#
#   forge verify-contract <address> <Contract> \
#     --verifier blockscout \
#     --verifier-url https://scan.botchain.ai/api/ \
#     --chain-id 677 --watch
