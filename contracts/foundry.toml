[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
via_ir = false
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
shrink_run_limit = 5000

[profile.ci.fuzz]
runs = 5000
[profile.ci.invariant]
runs = 1024
depth = 128

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
botchain = "${BOTCHAIN_RPC_URL}"
botchain_testnet = "${BOTCHAIN_TESTNET_RPC_URL}"

# BOT Chain's explorer runs Blockscout, not Etherscan. Blockscout verifies
# without credentials, so the key here is a placeholder the toolchain insists on
# rather than a secret - which is why verification was blocked on an API key
# that was never going to exist.
[etherscan]
botchain = { key = "blockscout", url = "https://scan.botchain.ai/api/", chain = 677 }
botchain_testnet = { key = "blockscout", url = "https://scan.bohr.life/api/", chain = 968 }
