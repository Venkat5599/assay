[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
via_ir = false
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
shrink_run_limit = 5000

[profile.ci.fuzz]
runs = 5000
[profile.ci.invariant]
runs = 1024
depth = 128

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
botchain = "${BOTCHAIN_RPC_URL}"
botchain_testnet = "${BOTCHAIN_TESTNET_RPC_URL}"

[etherscan]
botchain = { key = "${BOTSCAN_API_KEY}", url = "${BOTSCAN_VERIFIER_URL}", chain = 677 }
