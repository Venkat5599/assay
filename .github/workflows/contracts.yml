name: contracts

on:
  push:
    branches: [master, main]
    paths: ["contracts/**", "agent/**", "frontend/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", "agent/**", "frontend/**", ".github/workflows/contracts.yml"]

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Unit and integration tests
        run: forge test -vv

      # The CI profile raises fuzz runs 10x and invariant depth 2x. Local runs
      # stay fast; the expensive search happens here, once, per change.
      # The profile is selected by the environment. `--profile` was removed as
      # a `forge test` flag, and because the env var was already set here the
      # step failed on the argument rather than on a test - so this sweep has
      # not actually run in CI for as long as the toolchain has been current.
      - name: Fuzz and invariant sweep
        run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci

      # Gas is a correctness signal on a contract that moves escrow: a jump
      # here usually means a loop or a storage write nobody intended. Fuzz and
      # invariant runs are excluded because their means move between runs, so
      # including them would make this fail for no reason.
      - name: Gas snapshot
        run: forge snapshot --check --no-match-test "testFuzz|invariant" --no-match-contract "Invariants"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Coverage
        run: forge coverage --report summary --no-match-coverage "(script|test)"

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # The pricing kernel is the only thing allowed to turn a grade into a
      # number that moves capital. Determinism is the property under test.
      - name: Pricing kernel
        run: bun test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Settlement precision is the failure that does not throw: assume 18
      # decimals against a 6-decimal asset and every figure renders a million
      # times too large. These tests exist so it cannot come back silently.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
